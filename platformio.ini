; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; 時刻管理を楽にするための標準ライブラリを追加
lib_deps =
    https://github.com/KurtE/MTP_Teensy.git
    paulstoffregen/Time @ ^1.6.1
    https://github.com/vjmuzik/NativeEthernet.git
    https://github.com/vjmuzik/FNET.git
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.2
; 前回のLua設定なども残しておく場合
build_flags = 
    -D LUA_USE_C89
    -D USB_MTPDISK_SERIAL
    -I lua
    -I src
build_src_filter = +<*> +<../lua/*.c>
